<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Penghitung Placemark Google Earth</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1b1f24;--muted:#667085;--line:#e3e6ea;--accent:#1a73e8;--accent-soft:#e8f0fe;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--card:#1d2127;--text:#e8eaed;--muted:#9aa3ad;--line:#2d333b;--accent:#6ea8fe;--accent-soft:#1e2a3d}}
:root[data-theme="dark"]{--bg:#14171c;--card:#1d2127;--text:#e8eaed;--muted:#9aa3ad;--line:#2d333b;--accent:#6ea8fe;--accent-soft:#1e2a3d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
header{background:linear-gradient(90deg,#0d47a1,#1976d2);color:#fff;padding:18px 16px;box-shadow:0 2px 14px rgba(13,71,161,.28)}
.hd{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:16px}
.logo{width:64px;height:64px;flex:none;border-radius:14px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);display:grid;place-items:center}
.hd h1{font-size:1.3rem;letter-spacing:.4px;margin:0;text-transform:uppercase}
.hd p{margin:2px 0 0;font-size:.92rem}
.hd small{display:block;font-size:.75rem;opacity:.8;margin-top:3px}
main{max-width:720px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.4rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 16px;font-size:.95rem}
textarea{width:100%;height:220px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.total{margin-top:16px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:14px;padding:18px;text-align:center}
.total .n{font-size:3rem;font-weight:700;color:var(--accent);line-height:1}
.total .l{color:var(--muted);margin-top:4px}
.types{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.9rem}
.chip b{margin-left:4px}
.err{color:#d93025;margin-top:12px}
button{margin-top:10px;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);cursor:pointer}
</style>
</head>

    <div>
      <h1>Penghitung Placemark</h1>
      <p>Hitung Placemark Google Earth langsung dari KML</p>
      <small>By Rustam Rivai — versi online</small>
    </div>
  </div>
</header>
<main>
  <p class="sub">Tempel isi KML dari Google Earth di kotak bawah, jumlah Placemark langsung terhitung.</p>
  <textarea id="kml" placeholder="Tempel KML di sini…" spellcheck="false"></textarea>
  <button id="clear">Hapus</button>
  <div id="out"></div>
</main>
<script>
(function(){
  var ta=document.getElementById("kml"),out=document.getElementById("out");
  function typeOf(pm){
    var q=function(n){return pm.getElementsByTagNameNS("*",n).length};
    var t=[];
    if(q("Point"))t.push("Titik");
    if(q("LineString"))t.push("Garis");
    if(q("Polygon"))t.push("Poligon");
    if(q("Track"))t.push("Track");
    return t.length?t.join(" + "):"Tanpa geometri";
  }
  function run(){
    var s=ta.value.trim();
    if(!s){out.innerHTML="";return}
    var doc=new DOMParser().parseFromString(s,"text/xml");
    if(doc.getElementsByTagName("parsererror").length){
      var m=s.match(/<(?:\w+:)?Placemark[\s>]/g);
      out.innerHTML='<div class="err">KML tidak valid atau terpotong.'+(m?" Perkiraan kasar: "+m.length+" Placemark.":"")+'</div>';
      return;
    }
    var pms=Array.prototype.slice.call(doc.getElementsByTagNameNS("*","Placemark"));
    var c={};pms.forEach(function(p){var t=typeOf(p);c[t]=(c[t]||0)+1});
    var chips=Object.keys(c).sort(function(a,b){return c[b]-c[a]}).map(function(k){return '<span class="chip">'+k+'<b>'+c[k]+'</b></span>'}).join("");
    out.innerHTML='<div class="total"><div class="n">'+pms.length+'</div><div class="l">Placemark</div></div><div class="types">'+chips+'</div>';
  }
  ta.addEventListener("input",run);
  document.getElementById("clear").addEventListener("click",function(){ta.value="";run();ta.focus()});
})();
</script>
